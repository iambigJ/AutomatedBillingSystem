port: 3001
logLevel: debug
JWT_KEY: 'email-service-secret-key'

MONGO_General:
  url: mongodb
  port: 27017
  # If authentication is needed, uncomment and set these
  # user: admin
  # password: admin_password

Redis_General:
  uri: redis
  port: 6379
  # If authentication is needed, uncomment and set these
  # user: redis_user
  # password: redis_password

RabbitMQ:
  url: amqp://localhost:5672
  queue: daily_sales_report
  queueOptions:
    durable: true

Email:
  provider: 'sendgrid'  # or 'smtp' or 'mock'
  from: 'reports@example.com'
  to: 'management@example.com'
  templates:
    dailyReport: 'd-123456789'  # SendGrid template ID
  # SendGrid specific config
  sendgrid:
    apiKey: 'YOUR_SENDGRID_API_KEY'
  # SMTP specific config
  smtp:
    host: 'smtp.example.com'
    port: 587
    secure: false
    auth:
      user: 'smtp_user'
      pass: 'smtp_password' 